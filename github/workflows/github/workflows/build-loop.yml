name: Build Loop IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 选择Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: 编译Loop
        run: |
          xcodebuild archive \
            -project Loop.xcodeproj \
            -scheme Loop \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath Loop.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | xcpretty || true

      - name: 打包IPA
        run: |
          mkdir -p IPA/Payload
          cp -R Loop.xcarchive/Products/Applications/Loop.app IPA/Payload/
          cd IPA && zip -qr ../Loop-unsigned.ipa Payload/

      - name: 上传IPA
        uses: actions/upload-artifact@v4
        with:
          name: Loop-unsigned-ipa
          path: Loop-unsigned.ipa
          retention-days: 7
