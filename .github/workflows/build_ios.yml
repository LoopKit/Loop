name: Build Loop iOS Only
on:
  push:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Carthage
        run: brew install carthage

      - name: Install dependencies
        run: carthage bootstrap --platform iOS --cache-builds

      - name: Archive iOS App
        run: |
          xcodebuild archive \
            -scheme Loop \
            -destination generic/platform=iOS \
            -archivePath ./build/Loop.xcarchive \
            EXCLUDED_SOURCE_FILE_NAMES="*Watch*"

      - name: Generate export config and export IPA
        run: |
          cat > export.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath ./build/Loop.xcarchive \
            -exportOptionsPlist export.plist \
            -exportPath ./output

      - name: Upload compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: Loop-iOS安装包
          path: ./output/*.ipa
            -exportOptionsPlist export.plist \
            -exportPath ./output

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loop-iOS-IPA
          path: ./output/*.ipa

