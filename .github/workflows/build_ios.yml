name: Build Loop iOS Only
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: |
          brew install carthage
          carthage bootstrap --platform iOS

      - name: Build iOS App (Skip Watch target)
        run: |
          xcodebuild build archive export \
            -scheme Loop \
            -destination generic/platform=iOS \
            -archivePath loop.xcarchive \
            EXCLUDED_SOURCE_FILE_NAMES=*Watch*

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath loop.xcarchive \
            -exportOptionsPlist export.plist \
            -exportPath ./output

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Loop-iOS-IPA
          path: ./output/*.ipa

